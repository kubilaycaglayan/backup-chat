<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Backup Chat</title>
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Backup Chat">
  <style>html,body{background:#0d1117;color:#e6edf3}</style>
  <link rel="manifest" href="/manifest.webmanifest?v=21">
  <link rel="apple-touch-icon" href="/icon-neon-palm.png">
  <link rel="icon" href="/icon-neon-palm.png" type="image/png">
  <link rel="stylesheet" href="/style.css?v=21">
</head>
<body>
  <main class="app">
    <section id="nickname-screen" class="card">
      <h1>Backup Chat</h1>
      <p>Choose a nickname to enter the shared chat.</p>
      <form id="nickname-form">
        <label for="nickname">Nickname</label>
        <input id="nickname" name="nickname" maxlength="32" autocomplete="nickname" required>
        <p id="nickname-error" class="error" role="alert"></p>
        <button type="submit">Enter chat</button>
      </form>
    </section>

    <section id="chat-screen" class="chat card" hidden>
      <header>
        <h1>Backup Chat</h1>
        <div class="header-actions">
          <span id="connection-status">Connecting…</span>
          <button id="update-available" class="update-available" type="button" hidden>Restart to update</button>
        </div>
      </header>
      <div id="notification-prompt" class="notification-prompt" hidden>
        <button id="dismiss-notifications" class="dismiss-notifications" type="button" aria-label="Close notification prompt">×</button>
        <strong>Enable message notifications?</strong>
        <p>Get an alert when the chat is not open.</p>
        <button id="enable-notifications" type="button">Enable notifications</button>
        <p id="notification-status" class="status" role="status"></p>
      </div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <p id="chat-error" class="error" role="alert"></p>
      <form id="message-form" class="composer">
        <label class="visually-hidden" for="message">Message</label>
        <input id="message" name="message" maxlength="2000" autocomplete="off" placeholder="Write a message…" required>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <script src="/app.js?v=21"></script>
</body>
</html>
