<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <title>Sign in · Backup Chat</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
    main { box-sizing: border-box; width: min(100% - 32px, 360px); padding: 28px; border: 1px solid #30363d; border-radius: 12px; background: #161b22; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin: 16px 0 6px; }
    input, button { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #484f58; border-radius: 6px; font: inherit; }
    input { background: #0d1117; color: inherit; }
    button { margin-top: 22px; background: #238636; color: white; cursor: pointer; }
    .error { min-height: 1.25em; color: #ff7b72; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in to Backup Chat</h1>
    <p class="error" role="alert"><!-- ERROR --></p>
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
